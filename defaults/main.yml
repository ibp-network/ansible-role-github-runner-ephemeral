---

rootless_user: github-runner
rootless_group: github-runner
rootless_image: docker:dind-rootless
rootless_rundir: /run/user/{{ _user_info.uid }}
rootless_host: unix://{{ rootless_rundir }}/docker.sock

# please keep the user and group names according to myoung34's implementation, i.e. 'runner:1001:121'
runner_name: ibp-xx
runner_user: runner
runner_uid: 1001
runner_group: runner
runner_gid: 121
runner_dir: /home/runner
runner_scope: org
runner_labels: self-hosted,ephemeral,ubuntu-latest
runner_run_as_root: true
runner_disable_auto_update: false
runner_is_ephemeral: true
runner_image: myoung34/github-runner:ubuntu-noble