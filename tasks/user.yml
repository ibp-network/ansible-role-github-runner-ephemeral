---
- name: Create groups
  become: true
  ansible.builtin.group:
    name: "{{ rootless_group }}"
    state: present
  register: _group_info

- name: Create users
  become: true
  ansible.builtin.user:
    name: "{{ rootless_user }}"
    group: "{{ rootless_group }}"
    create_home: true
    state: present
    shell: "/bin/bash"
  register: _user_info

- name: Enable linger
  become: true
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ rootless_user }}"
    creates: "creates: /var/lib/systemd/linger/{{ rootless_user }}"

- name: Add exports to .bashrc
  become: true
  ansible.builtin.blockinfile:
    path: "{{ _user_info.home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    block: |
      export XDG_RUNTIME_DIR={{ rootless_rundir }}
      export DOCKER_HOST={{ rootless_host }}
